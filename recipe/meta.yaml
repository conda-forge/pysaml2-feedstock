{% set name = "pysaml2" %}
{% set version = "7.5.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pysaml2-{{ version }}.tar.gz
  sha256: bd17ce68ec3ba4ecd6457ecd94d9daa53fa57bd20d0a48824588983722b27905

build:
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry-core >=1.0.0
  run:
    - importlib-metadata >=1.7.0
    - importlib-resources
    - cryptography >=3.1
    - defusedxml
    - pyopenssl <24.3.0
    - python >={{ python_min }}
    - python-dateutil
    - pytz
    - requests >=2.0.0,<3.0.0
    - six
    - importlib_resources
    - xmlschema >=2.0.0,<3.0.0
    - setuptools

test:
  imports:
    - saml2
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://idpy.org
  dev_url: https://github.com/IdentityPython/pysaml2
  summary: Python implementation of SAML Version 2 Standard
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xhochy
